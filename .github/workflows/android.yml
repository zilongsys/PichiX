name: Android APK

# Compila PichiX en GitHub y publica el APK.
#  - push a main            -> build + Release vX.Y.Z (APK instalable desde el móvil)
#  - push a otras ramas / PR -> build + artefacto descargable (sin Release)
#  - Run workflow (manual)   -> build + artefacto
on:
  push:
    branches: ['**']
    paths-ignore: ['dist/**', '*.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necesario para crear/actualizar la Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Leer versión
        id: ver
        run: |
          set -euo pipefail
          f=app/version.properties
          major=$(grep '^VERSION_MAJOR=' $f | cut -d= -f2 | tr -d '\r')
          middle=$(grep '^VERSION_MIDDLE=' $f | cut -d= -f2 | tr -d '\r')
          patch=$(grep '^VERSION_PATCH=' $f | cut -d= -f2 | tr -d '\r')
          echo "name=$major.$middle.$patch" >> "$GITHUB_OUTPUT"

      - name: Comprobar CHANGELOG
        run: |
          if ! grep -q "^## v${{ steps.ver.outputs.name }}\b" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md no tiene la sección '## v${{ steps.ver.outputs.name }}'"
          fi

      - name: Preparar firma estable (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.PICHIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pichix.jks"
            echo "PICHIX_KEYSTORE_FILE=$RUNNER_TEMP/pichix.jks" >> "$GITHUB_ENV"
            echo "PICHIX_KEYSTORE_PASSWORD=${{ secrets.PICHIX_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PICHIX_KEY_ALIAS=${{ secrets.PICHIX_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "PICHIX_KEY_PASSWORD=${{ secrets.PICHIX_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::notice::Sin secreto PICHIX_KEYSTORE_BASE64: se firma con una clave debug efímera (el APK no actualiza sobre uno firmado distinto)."
          fi

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "PichiX-v${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PichiX-v${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: PichiX-v${{ steps.ver.outputs.name }}.apk
          retention-days: 30

      - name: Publicar Release (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.ver.outputs.name }}"
          apk="PichiX-$tag.apk"
          # Notas = sección de esta versión del CHANGELOG
          awk -v t="## $tag" '
            index($0, t)==1 {p=1; next}
            p && /^## v/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Build automático de $tag" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$apk" --target "${{ github.sha }}" --title "PichiX $tag" --notes-file notes.md --latest
          fi
